name: Prueba de la demo

on:
  push:
    branches: [main]
  pull_request:

env:
  DEFOLD: "1.10.4"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar LuaJIT, xvfb y OpenGL
        run: sudo apt-get update && sudo apt-get install -y luajit xvfb libglu1-mesa
      - name: Jugar los tres días con LuaJIT
        run: luajit tools/prueba.lua
      - name: Descargar Defold (bob.jar)
        run: curl -sSL -o bob.jar https://github.com/defold/defold/releases/download/$DEFOLD/bob.jar
      - name: Compilar para Linux
        run: java -jar bob.jar --root . --platform x86_64-linux --variant debug --archive --bundle-output build/linux resolve build bundle
      - name: Jugar los tres días dentro del motor
        run: |
          juego=$(find build/linux -name "*.x86_64" | head -1)
          xvfb-run -a -s "-screen 0 1920x1200x24" "$juego" --config=prueba.automatica=1 2>&1 | tee smoke.log
          grep -q "SMOKE TODO OK" smoke.log
          ! grep -E "^ERROR:SCRIPT" smoke.log

  apk:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Descargar Defold (bob.jar)
        run: curl -sSL -o bob.jar https://github.com/defold/defold/releases/download/$DEFOLD/bob.jar
      - name: Compilar el APK
        run: |
          java -jar bob.jar --root . --platform arm64-android --architectures arm64-android \
            --variant debug --archive --bundle-format apk --bundle-output build/android resolve build bundle
          apk=$(find build/android -name "*.apk" | head -1)
          cp "$apk" build/marea-bruja.apk
      - uses: actions/upload-artifact@v4
        with:
          name: marea-bruja-apk
          path: build/marea-bruja.apk
